# Maintainer Preference: keep identity, path, and the input marker on the left.
format = """
$username\
$hostname\
$directory\
$character\
"""

# Maintainer Preference: move contextual Git, timing, and Python information to
# the right so the command entry area stays visually quiet.
right_format = """
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$python\
"""

[directory]
style = "blue"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❮](red)"
vimcmd_symbol = "[|](purple)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
# Reusable rule: the zero-width markers preserve Starship's status grouping
# while showing one compact aggregate instead of a different glyph per state.
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
